name: Deploy

# Publishes site/ to Azure Static Web Apps. Runs on a push to main, or when you press
# "Run workflow" on the Actions tab. No pull_request trigger: this is a one-person blog,
# and leaving it out keeps the Free plan's preview environments unused.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerate home, archive, feed, sitemap and search index so they can never be stale,
      # then refuse to deploy a site that breaks the conventions.
      - run: node tools/build.mjs
      - run: node tools/check.mjs

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          output_location: ""
          skip_app_build: true
