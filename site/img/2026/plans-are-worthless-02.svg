<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 548" width="600" height="548" role="img" aria-label="The six phases of the spec-driven kit and who decides in each.">
  <style>
    .bg{fill:#ffffff}
    .box{fill:#ffffff;stroke:#171717;stroke-width:4}
    .agent{fill:#e8e8e3;stroke:#171717;stroke-width:4}
    .sun{fill:#ffd75e;stroke:#171717;stroke-width:4}
    .line{stroke:#171717;stroke-width:4;fill:none}
    .head{fill:#171717}
    text{font-family:"Nunito Sans","Segoe UI",system-ui,sans-serif;fill:#171717}
    .name{font-size:20px;font-weight:700}
    .gate{font-size:18px;font-weight:700;text-anchor:middle}
    .onsun{fill:#171717}
    .note{font-size:15px;fill:#555555;text-anchor:middle}
    .col{font-size:13px;font-weight:700;letter-spacing:2px}
    @media (prefers-color-scheme:dark){
      .bg{fill:#222226}
      .box{fill:#222226;stroke:#f5f5f2}
      .agent{fill:#2c2c31;stroke:#f5f5f2}
      .sun{stroke:#f5f5f2}
      .line{stroke:#f5f5f2}
      .head{fill:#f5f5f2}
      text{fill:#f5f5f2}
      .onsun{fill:#171717}
      .note{fill:#b0b0b0}
    }
  </style>
  <rect class="bg" width="600" height="548"/>

  <text class="col" x="96" y="30">PHASE</text>
  <text class="col" x="416" y="30">WHO DECIDES</text>

  <!-- 1 Investigate -->
  <rect class="box" x="96" y="44" width="280" height="52"/>
  <text class="name" x="116" y="77">1. Investigate</text>
  <path class="line" d="M376 70H416"/>
  <rect class="agent" x="416" y="44" width="160" height="52"/>
  <text class="gate" x="496" y="76">The agent</text>
  <path class="line" d="M236 96V116"/><path class="head" d="M224 116h24l-12 12z"/>

  <!-- 2 Interview -->
  <rect class="box" x="96" y="128" width="280" height="52"/>
  <text class="name" x="116" y="161">2. Interview</text>
  <path class="line" d="M376 154H416"/>
  <rect class="sun" x="416" y="128" width="160" height="52"/>
  <text class="gate onsun" x="496" y="160">I answer</text>
  <path class="line" d="M236 180V200"/><path class="head" d="M224 200h24l-12 12z"/>

  <!-- 3 Specify -->
  <rect class="box" x="96" y="212" width="280" height="52"/>
  <text class="name" x="116" y="245">3. Specify</text>
  <path class="line" d="M376 238H416"/>
  <rect class="sun" x="416" y="212" width="160" height="52"/>
  <text class="gate onsun" x="496" y="244">I approve</text>
  <path class="line" d="M236 264V284"/><path class="head" d="M224 284h24l-12 12z"/>

  <!-- 4 Build -->
  <rect class="box" x="96" y="296" width="280" height="52"/>
  <text class="name" x="116" y="329">4. Build one slice</text>
  <path class="line" d="M376 322H416"/>
  <rect class="agent" x="416" y="296" width="160" height="52"/>
  <text class="gate" x="496" y="328">The agent</text>
  <path class="line" d="M236 348V368"/><path class="head" d="M224 368h24l-12 12z"/>

  <!-- 5 Verify and approve -->
  <rect class="box" x="96" y="380" width="280" height="52"/>
  <text class="name" x="116" y="413">5. Verify and approve</text>
  <path class="line" d="M376 406H416"/>
  <rect class="sun" x="416" y="380" width="160" height="52"/>
  <text class="gate onsun" x="496" y="412">I commit</text>
  <path class="line" d="M236 432V452"/><path class="head" d="M224 452h24l-12 12z"/>

  <!-- loop 5 -> 4 -->
  <path class="line" d="M96 406H52V322H84"/><path class="head" d="M84 310l12 12-12 12z"/>
  <text class="note" transform="translate(34 364) rotate(-90)">next slice</text>

  <!-- 6 Review -->
  <rect class="box" x="96" y="464" width="280" height="52"/>
  <text class="name" x="116" y="497">6. Review</text>
  <path class="line" d="M376 490H416"/>
  <rect class="sun" x="416" y="464" width="160" height="52"/>
  <text class="gate onsun" x="496" y="496">I push</text>
</svg>
